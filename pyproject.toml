[project]
name = "meeting-briefer"
version = "0.1.0"
description = "Turn a meeting transcript into validated action items and a short spoken briefing (Claude + ElevenLabs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kasper Aune Dahl" }]
dependencies = [
    "anthropic>=2.3",
    "elevenlabs>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
meeting-briefer = "meeting_briefer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_briefer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
